CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_EFI_STUB=y
CONFIG_DEVMEM=y

# Enable 32-bit binary execution on x86_64
CONFIG_IA32_EMULATION=y
CONFIG_X86_X32=y

# 32-bit ELF and compatibility layer
CONFIG_COMPAT=y
CONFIG_HAVE_ARCH_COMPAT=y

# Enable vsyscall emulation for 32-bit apps
CONFIG_LEGACY_VSYSCALL_EMULATE=y

# Support for 32-bit syscalls in a 64-bit kernel
CONFIG_X86_32_COMPAT=y

# Additional settings to allow 32-bit applications to run smoothly
CONFIG_BINFMT_ELF=y
CONFIG_BINFMT_SCRIPT=y
CONFIG_BINFMT_MISC=y
CONFIG_OLD_SIGSUSPEND3=y
CONFIG_OLD_SIGACTION=y
CONFIG_COMPAT_32BIT_TIME=y
