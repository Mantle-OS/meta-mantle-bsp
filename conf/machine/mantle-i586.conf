#@TYPE: Machine
#@NAME: Mantle i586
#@DESCRIPTION: 32 bit i586 based meta-yocto-bsp

include conf/machine/include/x86/x86-base.inc
require conf/machine/include/x86/qemuboot-x86.inc
require conf/machine/include/mantle-x86.inc
require conf/machine/include/x86/tune-i586.inc
MACHINEOVERRIDES:append = ":qemux86"
MACHINE_FEATURES:append = " pcbios i915 efi"

## Bootloader 
EFI = "1"
EFI_PROVIDER = "grub-efi"

## Kernel
PREFERRED_VERSION_linux-yocto ?= "6.6%"
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"

## Image 
WKS_FILES = "x86-grub2-biosplusefi.wks"
IMAGE_FSTYPES += "wic iso tar.gz"

QB_SYSTEM_NAME = "qemu-system-i386"
# PACKAGE_FEED_ARCHS="all core2-32 core2_32 core2-32-intel-common x86"
